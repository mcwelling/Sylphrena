[workspace]
members = ["crates/syl-core", "crates/syl-container"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
syl-core = { path = "crates/syl-core" }
syl-container = { path = "crates/syl-container" }
urithiru = { git = "https://github.com/mcwelling/urithiru" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tempfile = "3"
wiremock = "0.6"
similar = "2"
base64 = "0.22"

# The TUI client: the `syl` binary.
[package]
name = "syl-rs"
version.workspace = true
edition.workspace = true

[lib]
name = "syl_rs"
path = "src/lib.rs"

[[bin]]
name = "syl"
path = "src/main.rs"

[dependencies]
syl-core.workspace = true
syl-container.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
crossterm = "0.28"
rustyline = "14"
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
